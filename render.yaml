services:
  - type: web
    name: cv-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cv-db
          property: connectionString

databases:
  - name: cv-db
    plan: free
    region: frankfurt
